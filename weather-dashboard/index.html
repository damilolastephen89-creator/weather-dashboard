<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Weather Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<script type="module" src="js/app.js"></script>

</head>

<body>

<header class="header">

<h1>🌦 Weather Dashboard</h1>

<div class="search-box">

<input
id="cityInput"
type="text"
placeholder="Enter city name">

<button id="searchBtn">
Search
</button>

<button id="themeToggle">
Theme
</button>

</div>

</header>

<main>

<section class="current-weather">

<h2 id="cityName">
Lagos
</h2>

<img
id="icon"
alt="Weather Icon">

<div id="temperature">
--
</div>

<div id="description">
Loading...
</div>

</section>

<section id="aiForecast"
class="ai-panel">
</section>

<section>

<h2>
5 Day Forecast
</h2>

<div
id="forecast"
class="forecast-grid">
</div>

</section>

<section class="charts">

<div class="chart-card">

<h3>
Temperature Trend
</h3>

<canvas id="tempChart"></canvas>

</div>

<div class="chart-card">

<h3>
Humidity Trend
</h3>

<canvas id="humidityChart"></canvas>

</div>

</section>

</main>

<div
id="weatherModal"
class="modal">

<div class="modal-content">

<button
class="close">
×
</button>

<h3>
Weather Details
</h3>

<p id="modalDate"></p>

<p id="modalTemp"></p>
