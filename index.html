<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Weather Dashboard</title>

  <link
    rel="stylesheet"
    href="./css/style.css">

  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4facfe">
  
  <script
    type="module"
    src="./js/app.js"></script>
  
</head>

<body>

  <header class="header">

    <h1>🌦 Weather Dashboard</h1>

    <div class="search-box">

      <input
        id="cityInput"
        type="text"
        placeholder="Enter city name">

      <button id="searchBtn">
        Search
      </button>

      <button id="locationBtn">
        📍 My Location
      </button>

      <button id="themeToggle">
        Theme
      </button>

    </div>

  </header>

  <main>

    <!-- Current Weather -->
    <section class="current-weather">

      <h2 id="cityName">
        Lagos
      </h2>

      <img
        id="icon"
        src=""
        alt="Weather Icon">

      <div id="temperature">
        --
      </div>

      <div id="description">
        Loading weather...
      </div>

    </section>

    <!-- AI Forecast -->
    <section
      id="aiForecast"
      class="ai-panel">
    </section>

    <section
  id="aqiPanel"
  class="aqi-panel">
</section>

    <section
  id="alertsPanel"
  class="alerts-panel">
</section>
    
    <!-- Favorites -->
    <section class="favorites">

      <h3>
        ⭐ Favorite Cities
      </h3>

      <div id="favoritesList"></div>

      <button id="saveFavoriteBtn">
        Save Current City
      </button>

    </section>

    <!-- Recent Searches -->
    <section class="recent-searches">

      <h3>
        🕒 Recent Searches
      </h3>

      <div id="recentSearchesList"></div>

    </section>

    <!-- Forecast -->
    <section>

      <h2>
        5-Day Forecast
      </h2>

      <div
        id="forecast"
        class="forecast-grid">
      </div>

    </section>

    <!-- Charts -->
    <section class="charts">

      <div class="chart-card">

        <h3>
          Temperature Trend
        </h3>

        <canvas id="tempChart"></canvas>

      </div>

      <div class="chart-card">

        <h3>
          Humidity Trend
        </h3>

        <canvas id="humidityChart"></canvas>

      </div>

      <div class="chart-card">

        <h3>
          Rainfall Forecast
        </h3>

        <canvas id="rainChart"></canvas>

      </div>

    </section>

  </main>

  <!-- Weather Details Modal -->
  <div
    id="weatherModal"
    class="modal">

    <div class="modal-content">

      <button
        class="close"
        type="button">
        ×
      </button>

      <h3>
        Weather Details
      </h3>

      <p id="modalDate"></p>

      <p id="modalTemp"></p>

      <p id="modalDescription"></p>

    </div>

  </div>

</body>

</html>
